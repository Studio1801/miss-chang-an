<style>
:root { color-scheme: light; --bg: #fff3d9; --paper: #f7e6c0; --card: #fff8e6; --ink: #2e1712; --muted: #6a4d42; --line: #dcc79c; --red: #ad3b27; --red-d: #8f2e1d; --green: #3f7d4e; --serif: "Libre Baskerville", Georgia, serif; --sans: "Inter", system-ui, sans-serif; --zh: "Noto Serif SC", "Songti SC", serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }

.wrap { max-width: 1040px; margin: 0 auto; padding-inline: max(20px, env(safe-area-inset-left)); }

.top { background: rgba(255,243,217,.9); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--line); }

.brand { margin-right: auto; min-width: 0; }

.lang { display: inline-flex; background: var(--paper); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--red); color: var(--bg); }
.tabs { display: flex; gap: 26px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 10px 0 13px; font-weight: 600; color: var(--muted); position: relative; white-space: nowrap; min-height: 44px; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--red); border-radius: 3px 3px 0 0; }
.tab .dot { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--red); color: var(--bg); font-size: 12px; }

main { padding-block: 28px 80px; }
.panel { animation: in .35s cubic-bezier(.2,.8,.2,1) both; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: clamp(20px, 3vw, 30px); box-shadow: 0 24px 40px -36px rgba(61,26,19,.55); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 22px; }
.stat { padding: 22px 24px; }
.stat span { color: var(--muted); font-size: 14px; }
.stat b { display: block; font-family: var(--serif); font-size: clamp(32px, 5vw, 46px); line-height: 1.1; margin-top: 4px; }
.stat.hot b { color: var(--red); }
.stat small { color: var(--muted); font-size: 13.5px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 30px 0 14px; flex-wrap: wrap; }
.sec-head h2 { font-size: clamp(22px, 3vw, 28px); }
.sec-head p { margin: 0; color: var(--muted); font-size: 14.5px; }

.band { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--ink); color: var(--bg); border-radius: 26px; padding: clamp(22px, 3vw, 34px) clamp(22px, 4vw, 48px); gap: 20px; margin-bottom: 26px; }
.band span { color: #e4cdb0; font-size: 14.5px; display: block; }
.band b { font-family: var(--serif); font-size: clamp(34px, 5.4vw, 58px); line-height: 1.1; display: block; margin-top: 4px; }
.band .hot b { color: #ee8a73; }
.wk-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.wk-head p { margin: 0; color: var(--muted); font-size: 14.5px; }
.wk-nav { display: flex; align-items: center; gap: 12px; }
.wk-nav h2 { font-size: 22px; min-width: 150px; text-align: center; }
.wk-nav button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 22px; line-height: 1; }
.wk-nav button:disabled { opacity: .35; cursor: default; }
.strip { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 14px; margin-inline: calc(-1 * max(20px, env(safe-area-inset-left))); padding-inline: max(20px, env(safe-area-inset-left)); scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.col { flex: 0 0 min(290px, 80vw); scroll-snap-align: start; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 18px 14px 14px; align-self: flex-start; }
.col.now { border: 2px solid var(--ink); background: #fffaf0; }
.col header { padding: 0 6px 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.col header > div { display: flex; align-items: baseline; gap: 8px; }
.col header small { color: var(--muted); font-size: 15px; }
.col header b { font-family: var(--serif); font-size: 30px; line-height: 1; }
.col header p { flex-basis: 100%; margin: 4px 0 0; color: var(--muted); font-size: 14.5px; }
.today { margin-left: auto; color: var(--red); font-weight: 700; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.today::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.oc { background: var(--paper); border-radius: 16px; padding: 12px 14px; display: grid; gap: 3px; }
.oc.done { background: #f4e7c8; }
.oc.done .oc-name, .oc.done .oc-top b { color: var(--muted); }
.oc.web { background: #fff; box-shadow: 0 0 0 2px var(--red) inset; }
.oc-top { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.oc-top b { color: var(--ink); font-variant-numeric: tabular-nums; }
.oc-name { font-weight: 700; }
.oc-what { color: var(--muted); font-size: 13.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.oc-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.oc-type { font-size: 13px; color: var(--muted); }
.oc .act { width: 100%; margin-top: 8px; }
.chip.done { background: rgba(0,0,0,.06); }
.orders { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.order { display: grid; grid-template-columns: 76px 1fr auto auto; align-items: center; gap: 6px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px 20px; }
.order.web { border-color: var(--red); box-shadow: 0 0 0 1px var(--red) inset; }
.order .t { color: var(--muted); font-size: 14.5px; font-variant-numeric: tabular-nums; }
.order .who { font-weight: 700; }
.order .what { color: var(--muted); font-size: 14px; display: block; }
.order .amt { font-weight: 700; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--red); color: var(--bg); margin-left: 8px; vertical-align: 2px; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: var(--paper); color: var(--muted); white-space: nowrap; }
.chip.new { background: var(--red-soft, #f6d6c4); color: var(--red); }
.chip.prep { background: #f3e2a8; color: #7a5a10; }
.chip.ready { background: #d6ebd7; color: #2c6a3b; }
.act { border: 0; background: var(--red); color: var(--bg); font-weight: 700; padding: 9px 18px; border-radius: 999px; min-height: 40px; }
.act:hover { background: var(--red-d); }
.order .right { display: flex; align-items: center; gap: 12px; justify-content: flex-end; min-width: 220px; }
.empty { color: var(--muted); padding: 18px 4px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
.day { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 8px; text-align: center; }
.day.now { border-color: var(--red); box-shadow: 0 0 0 1px var(--red) inset; }
.day small { color: var(--muted); display: block; font-size: 13px; }
.day b { font-family: var(--serif); font-size: 20px; display: block; margin: 2px 0; }
.day span { font-size: 13px; color: var(--muted); }

.split { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; align-items: start; }
.kpi-row { display: flex; gap: clamp(20px, 4vw, 56px); flex-wrap: wrap; align-items: baseline; margin-bottom: 22px; }
.kpi-row b { font-family: var(--serif); font-size: clamp(36px, 5vw, 54px); line-height: 1; display: block; }
.kpi-row span { color: var(--muted); font-size: 14px; }
.delta { color: var(--green); font-weight: 600; }
.delta.down { color: var(--red); }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; align-items: end; height: 190px; border-bottom: 1px solid var(--line); padding-bottom: 0; }
.bar { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 6px; font-size: 12.5px; color: var(--muted); }
.bar i { width: 100%; max-width: 54px; background: var(--paper); border-radius: 12px 12px 0 0; min-height: 3px; display: block; transition: height .6s cubic-bezier(.2,.8,.2,1); }
.bar.top i { background: var(--red); }
.bar.now i { background: #d58b78; }
.labels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; text-align: center; font-size: 13.5px; color: var(--muted); padding-top: 8px; }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.rank li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 15px; }
.rank .meter { grid-column: 1 / 3; height: 6px; background: var(--paper); border-radius: 6px; overflow: hidden; }
.rank .meter i { display: block; height: 100%; background: var(--red); border-radius: 6px; }
.rank small { color: var(--muted); }
.share { height: 14px; border-radius: 14px; overflow: hidden; display: flex; background: var(--paper); margin: 12px 0 8px; }
.share i { background: var(--red); display: block; }
.note { color: var(--muted); font-size: 13px; margin: 14px 0 0; }

.tools { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.search { flex: 1; min-width: 220px; height: 48px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); padding: 0 20px; }
.pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; margin-bottom: 18px; }
.pill { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14.5px; color: var(--muted); min-height: 40px; }
.pill[aria-pressed="true"] { background: var(--red); color: var(--bg); border-color: var(--red); }
.btn { border: 0; background: var(--red); color: var(--bg); font-weight: 700; padding: 12px 22px; border-radius: 999px; min-height: 48px; }
.btn:hover { background: var(--red-d); }
.btn.ghost { background: transparent; color: var(--red); border: 1.5px solid var(--red); }
.dishes { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.dish { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px 18px; }
.dish.off { background: transparent; border-style: dashed; }
.dish.off .dn { color: var(--muted); }
.dish img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; }
.dish .ph { width: 56px; height: 56px; border-radius: 12px; background: var(--paper); display: grid; place-items: center; color: var(--red); font-family: var(--zh); font-size: 22px; }
.dn { font-weight: 700; line-height: 1.3; }
.dz { color: var(--red); font-size: 13.5px; margin-left: 6px; }
.dp { display: flex; align-items: center; gap: 6px; margin-top: 4px; color: var(--muted); font-size: 14px; }
.dp input { width: 84px; height: 34px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 8px; font-variant-numeric: tabular-nums; }
.switch { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.sw { width: 52px; height: 30px; border-radius: 30px; border: 0; background: var(--green); position: relative; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 25px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 2px 4px rgba(0,0,0,.25); }
.sw[aria-checked="false"] { background: #b9a58e; }
.sw[aria-checked="false"]::after { left: 3px; }
.rm { border: 0; background: none; color: var(--red); font-size: 12.5px; text-decoration: underline; padding: 0; margin-left: 8px; }
.form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 14px; }
.form label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
.form input, .form select { height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); padding: 0 14px; }
.form .full { grid-column: 1 / 3; }
.form .actions { display: flex; gap: 10px; }

.ctl { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-block: 18px; }
.ctl + .ctl { border-top: 1px solid var(--line); }
.ctl h3 { font-size: 18px; margin-bottom: 4px; }
.ctl p { margin: 0; color: var(--muted); font-size: 14.5px; max-width: 520px; }
.ctl .sw { flex: none; }
.notice-box { display: grid; gap: 10px; padding-bottom: 18px; }
.notice-box input { height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); padding: 0 16px; width: 100%; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.checks li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; }
.checks i { width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: #fff; font-style: normal; font-size: 13px; display: grid; place-items: center; margin-top: 2px; }
.checks b { display: block; }
.checks span { color: var(--muted); font-size: 14.5px; }
.links { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
.live { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.live::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
.live.closed::before { background: #b9a58e; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px); opacity: 0; background: var(--ink); color: var(--bg); padding: 12px 22px; border-radius: 999px; font-size: 15px; z-index: 30; pointer-events: none; transition: .3s; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.demo { background: var(--paper); border-radius: 14px; padding: 10px 16px; font-size: 13.5px; color: var(--muted); margin-bottom: 20px; }

@media (min-width: 801px) { .strip { margin-inline: 0; padding-inline: 0; } }
@media (max-width: 800px) {
  .split { grid-template-columns: 1fr; }
  .dishes { grid-template-columns: 1fr; }
  .week { grid-template-columns: repeat(4, 1fr); }
  .form { grid-template-columns: 1fr; } .form .full { grid-column: 1; }
}
@media (max-width: 560px) {
  .band { grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 20px; } .band span { font-size: 12.5px; }
  .brand .bz { display: none; }
  .stats { grid-template-columns: 1fr 1fr; } .stat:first-child { grid-column: 1 / 3; }
  .order { grid-template-columns: 1fr auto; } .order .t { grid-column: 1 / 3; } .order .right { min-width: 0; }
  .order .right { grid-column: 1 / 3; justify-content: space-between; }
  .ctl { flex-direction: column; align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

</header>

  <section id="menu" class="panel" role="tabpanel" aria-labelledby="tab-menu" hidden></section>
  <section id="site" class="panel" role="tabpanel" aria-labelledby="tab-site" hidden></section>
  <section id="sales" class="panel" role="tabpanel" aria-labelledby="tab-sales" hidden></section>
</main>

    }).join("");
    $("orders").innerHTML = `<div class="band"><div><span>${L.ordersToday}</span><b>${n}</b></div><div><span>${L.salesToday}</span><b>${money(sales)}</b></div><div class="${left ? "hot" : ""}"><span>${L.waiting}</span><b>${left}</b></div></div>
      <div class="wk-head"><div class="wk-nav"><button type="button" data-wk="-1" aria-label="Previous week">‹</button><h2>${range}</h2><button type="button" data-wk="1" aria-label="Next week" ${wo >= 0 ? "disabled" : ""}>›</button></div><p>${L.queueSub}</p></div>
      <div class="strip" id="strip">${cols}</div>
      <p class="demo" style="margin-top:24px">${L.demoNote}</p>`;
    if (firstScroll && wo === 0) { const c = document.querySelector(".col.now"), st = $("strip"); if (c && st && !$("orders").hidden) { st.scrollLeft = Math.max(0, c.offsetLeft - st.offsetLeft - 8); firstScroll = false; } }
    renderTopTabs();
  }
  const NEXT = { new: "prep", prep: "ready", ready: "done" };
  function advance(id) {
    const s = todaySample.find(o => o.id === id);
    if (s) { s.status = NEXT[s.status]; }
    else { const w = webOrders.find(o => o.id === id); if (w) { w.status = NEXT[w.status || "new"]; saveOrders(webOrders); } }
    renderOrders();
  }

  /* ---------- Menu ---------- */
  function renderMenu() {
    const L = t(), all = dishes(), q = mq.trim().toLowerCase();
    const shown = all.filter(d => (mcat === "all" || d.cat === mcat) && (!q || (d.en + " " + d.zh).toLowerCase().includes(q)));
    const pills = [`<button type="button" class="pill" data-c="all" aria-pressed="${mcat === "all"}">${L.all} ${all.length}</button>`].concat(CATS.map(c => `<button type="button" class="pill" data-c="${c.id}" aria-pressed="${mcat === c.id}">${esc(c.title)}</button>`)).join("");
    const rows = shown.map(d => { const off = S.off.includes(d.id), ph = PHOTO[d.id];
      return `<li class="dish ${off ? "off" : ""}">${ph ? `<img src="${ph}" alt="" loading="lazy">` : `<span class="ph" aria-hidden="true">${(CATS.find(c => c.id === d.cat) || {}).ch || ""}</span>`}
        <div><div class="dn">${esc(d.en)}${d.zh ? `<span class="dz zh" lang="zh">${esc(d.zh)}</span>` : ""}${d.custom ? `<button type="button" class="rm" data-rm="${d.id}">${L.remove}</button>` : ""}</div>
        <label class="dp">${d.from ? "from " : ""}$<input type="number" min="0" step="0.01" value="${priceOf(d).toFixed(2)}" data-price="${d.id}" aria-label="${L.price}: ${esc(d.en)}"></label></div>
        <div class="switch"><button type="button" class="sw" role="switch" aria-checked="${!off}" aria-label="${esc(d.en)}: ${L.availL}" data-sw="${d.id}"></button><span>${off ? L.sold : L.avail}</span></div></li>`; }).join("");
    const form = adding ? `<div class="card" style="margin-bottom:18px"><h3>${L.addDish}</h3><form class="form" id="addForm">
      <label>${L.fName}<input name="en" required maxlength="60"></label><label>${L.fZh}<input name="zh" maxlength="20" lang="zh"></label>
      <label>${L.fPrice}<input name="price" type="number" min="0" step="0.01" required></label><label>${L.fCat}<select name="cat">${CATS.map(c => `<option value="${c.id}">${esc(c.title)}</option>`).join("")}</select></label>
      <label class="full">${L.fDesc}<input name="desc" maxlength="120"></label><div class="actions full"><button class="btn" type="submit">${L.save}</button><button class="btn ghost" type="button" id="addCancel">${L.cancel}</button></div></form></div>` : "";
    $("menu").innerHTML = `<div class="sec-head" style="margin-top:0"><div><h2>${L.menuTitle}</h2><p>${L.menuSub}</p></div><button type="button" class="btn" id="addDish">+ ${L.addDish}</button></div>${form}
      <div class="tools"><input class="search" type="search" id="mq" value="${esc(mq)}" placeholder="${L.find}" aria-label="${L.find}"></div>
      <div class="pills">${pills}</div>${shown.length ? `<ul class="dishes">${rows}</ul>` : `<p class="empty">${L.noMatch}</p>`}`;
    if (q) { const el = $("mq"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }

  /* ---------- Website ---------- */
  function renderSite() {
    const L = t(), op = isOpen();
    $("site").innerHTML = `<div class="sec-head" style="margin-top:0"><div><h2>${L.siteTitle}</h2><p>${L.siteSub}</p></div><span class="live ${op ? "" : "closed"}">${op ? L.open : L.shut}</span></div>
      <div class="card">
        <div class="ctl"><div><h3>${L.pauseT}</h3><p>${L.pauseD}</p></div><button type="button" class="sw" role="switch" aria-checked="${S.paused}" aria-label="${L.pauseT}" id="pause" style="${S.paused ? "background:var(--red)" : ""}"></button></div>
        <div class="ctl" style="display:block"><h3>${L.noticeT}</h3><p>${L.noticeD}</p><div class="notice-box" style="margin-top:12px"><input id="noticeIn" value="${esc(S.notice)}" maxlength="120" placeholder="${L.noticePh}" aria-label="${L.noticeT}"><div class="links" style="margin:0"><button type="button" class="btn" id="noticeSave">${L.noticeBtn}</button>${S.notice ? `<button type="button" class="btn ghost" id="noticeClear">${L.noticeClear}</button>` : ""}</div></div></div>
      </div>
      <div class="sec-head"><h2>${L.synced}</h2></div>
      <div class="card"><ul class="checks">${L.checks.map(c => `<li><i aria-hidden="true">✓</i><div><b>${c[0]}</b><span>${c[1]}</span></div></li>`).join("")}</ul><div class="links"><a class="btn" href="${SITE_URL}" target="_blank" rel="noopener">${L.openSite}</a></div></div>
      <p class="demo" style="margin-top:20px">${L.sampleNote}</p>`;
  }

  /* ---------- Sales ---------- */
  function renderSales() {
    const L = t(), cur = weekDays(0), prev = weekDays(-1), sum = a => a.reduce((s, d) => s + d.sum, 0), cnt = a => a.reduce((s, d) => s + d.os.length, 0);
    const ti = cur.findIndex(d => d.isToday), tot = sum(cur), pt = sum(prev.slice(0, ti + 1)), delta = pt ? Math.round((tot - pt) / pt * 100) : 0, n = cnt(cur), mx = Math.max(1, ...cur.map(d => d.sum)), bestI = cur.reduce((b, d, i) => d.sum > cur[b].sum ? i : b, 0);
    const tally = {}; cur.forEach(d => d.os.forEach(o => o.items.forEach(i => { const k = i.name; tally[k] = (tally[k] || 0) + i.qty; })));
    const rank = Object.entries(tally).sort((a, b) => b[1] - a[1]).slice(0, 6), top = rank[0] ? rank[0][1] : 1;
    const all = cur.flatMap(d => d.os), del = all.filter(o => o.type === "delivery").reduce((s, o) => s + o.total, 0), pct = tot ? Math.round(del / tot * 100) : 0;
    $("sales").innerHTML = `<div class="split"><div class="card"><div class="kpi-row"><div><b>${money(tot)}</b><span>${L.weekSales} · <span class="delta ${delta < 0 ? "down" : ""}">${L.vs((delta >= 0 ? "+" : "") + delta + "%")}</span></span></div><div><b>${n}</b><span>${L.ordersL}</span></div><div><b>${n ? money2(tot / n) : "$0"}</b><span>${L.avgL}</span></div></div>
      <h3 style="font-size:18px;margin-bottom:14px">${L.byDay}</h3>
      <div class="bars">${cur.map((d, i) => `<div class="bar ${i === bestI && d.sum ? "top" : ""} ${d.isToday ? "now" : ""}"><span>${d.sum ? money(d.sum) : ""}</span><i style="height:${Math.max(2, d.sum / mx * 150)}px"></i></div>`).join("")}</div>
      <div class="labels">${cur.map(d => `<span>${L.days[d.d.getDay()]}</span>`).join("")}</div></div>
      <div style="display:grid;gap:20px"><div class="card"><h3 style="font-size:18px;margin-bottom:16px">${L.best}</h3><ul class="rank">${rank.map(([nm, q]) => `<li><span>${esc(nm)}</span><small>${L.soldN(q)}</small><span class="meter"><i style="width:${q / top * 100}%"></i></span></li>`).join("")}</ul></div>
      <div class="card"><h3 style="font-size:18px">${L.split}</h3><div class="share"><i style="width:${100 - pct}%"></i></div><small style="color:var(--muted)">${L.pickup} ${100 - pct}% · ${L.delivery} ${pct}%</small></div></div></div><p class="demo" style="margin-top:22px">${L.sampleSales}</p>`;
  }

  /* ---------- chrome ---------- */
  function renderTop() {
    const L = t();
    $("today").textContent = lang === "zh" ? `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${L.daysLong[now.getDay()]}` : `${L.daysLong[now.getDay()]}, ${L.mon[now.getMonth()]} ${now.getDate()}`;
    ["menu", "site", "sales"].forEach(k => { $("tab-" + k).textContent = L.tabs[k]; });
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  }
  function renderAll() { renderTop(); renderOrders(); if (!$("menu").hidden) renderMenu(); if (!$("site").hidden) renderSite(); if (!$("sales").hidden) renderSales(); }
  function show(id) {
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === id)));
    ["orders", "menu", "site", "sales"].forEach(k => { $(k).hidden = k !== id; });
    ({ orders: renderOrders, menu: renderMenu, site: renderSite, sales: renderSales })[id]();
    const p = $(id); p.style.animation = "none"; void p.offsetWidth; p.style.animation = "";
    renderTopTabs();
  }
  function renderTopTabs() { const open = webOrders.filter(o => (o.status || "new") === "new").length; $("tab-orders").innerHTML = `${t().tabs.orders}${open ? `<span class="dot">${open}</span>` : ""}`; }

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-wk],[data-tab],[data-lang],[data-adv],[data-c],[data-sw],[data-rm],#pause,#noticeSave,#noticeClear,#addDish,#addCancel"); if (!el) return;
    if (el.dataset.wk) { wo = Math.min(0, wo + +el.dataset.wk); return renderOrders(); }
    if (el.dataset.tab) return show(el.dataset.tab);
    if (el.dataset.lang) { lang = el.dataset.lang; try { localStorage.setItem("mca-dash-lang", lang); } catch (_) {} return renderAll(); }
    if (el.dataset.adv) return advance(el.dataset.adv);
    if (el.dataset.c) { mcat = el.dataset.c; return renderMenu(); }
    if (el.dataset.sw) { const id = el.dataset.sw, d = dishes().find(x => x.id === id), off = !S.off.includes(id); S.off = off ? S.off.concat(id) : S.off.filter(x => x !== id); save(); renderMenu(); return toast(off ? t().wentOff(d.en) : t().wentOn(d.en)); }
    if (el.dataset.rm) { S.added = S.added.filter(a => a.id !== el.dataset.rm); S.off = S.off.filter(x => x !== el.dataset.rm); save(); return renderMenu(); }
    if (el.id === "addDish") { adding = true; return renderMenu(); }
    if (el.id === "addCancel") { adding = false; return renderMenu(); }
    if (el.id === "pause") { S.paused = !S.paused; save(); renderSite(); return toast(S.paused ? t().pausedOn : t().pausedOff); }
    if (el.id === "noticeSave") { S.notice = $("noticeIn").value.trim(); save(); renderSite(); return toast(S.notice ? t().noticeOn : t().noticeOff); }
    if (el.id === "noticeClear") { S.notice = ""; save(); renderSite(); return toast(t().noticeOff); }
  });
  document.addEventListener("input", e => { if (e.target.id === "mq") { mq = e.target.value; renderMenu(); } });
  document.addEventListener("change", e => {
    const id = e.target.dataset && e.target.dataset.price; if (!id) return;
    const v = parseFloat(e.target.value); if (!isFinite(v) || v < 0) return renderMenu();
    const d = dishes().find(x => x.id === id);
    if (d.custom) S.added = S.added.map(a => a.id === id ? { ...a, price: v } : a); else S.prices[id] = v;
    save(); toast(t().priceSet(d.en));
  });
  document.addEventListener("submit", e => {
    if (e.target.id !== "addForm") return; e.preventDefault();
    const f = new FormData(e.target), en = String(f.get("en")).trim(), price = parseFloat(f.get("price")); if (!en || !isFinite(price)) return;
    S.added.push({ id: "new-" + Date.now().toString(36), name: en, chinese: String(f.get("zh")).trim(), price, cat: String(f.get("cat")), description: String(f.get("desc")).trim() });
    save(); adding = false; mcat = String(f.get("cat")); renderMenu(); toast(t().added(en));
  });
  window.addEventListener("storage", e => { if (e.key === OKEY) { webOrders = loadOrders(); renderOrders(); renderTopTabs(); } if (e.key === KEY) { S = load(); } });
  window.addEventListener("focus", () => { webOrders = loadOrders(); S = load(); if (!$("orders").hidden) renderOrders(); renderTopTabs(); });

  renderAll(); renderTopTabs();
})();
</script>

</body>
</html>
